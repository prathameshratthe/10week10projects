services:
  # Week 01 - WarrantyWise
  - type: web
    name: warrantywise-week01
    env: docker
    dockerfilePath: projects/week-01-warrantywise/Dockerfile
    dockerContext: projects/week-01-warrantywise
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./warrantywise.db

  # Week 02 - ScamLens India
  - type: web
    name: scamlens-india-week02
    env: python
    buildCommand: pip install -r projects/week-02-scamlens-india/backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir projects/week-02-scamlens-india/backend --host 0.0.0.0 --port $PORT
    plan: free

