name: CI - Week 01 WarrantyWise

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/week-01-warrantywise/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        run: pytest -v

      - name: Run Quantitative Evaluation Benchmark
        run: python ../eval/evaluate.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/week-01-warrantywise/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: projects/week-01-warrantywise/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Bundle
        run: npm run build
